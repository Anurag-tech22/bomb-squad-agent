name: Autonomous DevOps Bomb Squad Enterprise CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Type Check & Code Quality (Qodo Standards)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install pytest pytest-asyncio pytest-cov pydantic mcp ruff mypy

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile src/mcp_servers/cache_cleaner_server.py
          python -m py_compile cache_cleaner_server.py

      - name: Run Ruff Linting & Formatting Analysis
        run: |
          ruff check src/ tests/ --ignore E501 || true

      - name: Run Pytest Test Suite & Coverage Analysis
        run: |
          pytest tests/ -v --tb=short
