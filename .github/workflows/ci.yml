name: Autonomous DevOps Bomb Squad Enterprise CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Run Unit Tests & Qodo Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONPATH: "."

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic mcp

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile src/mcp_servers/cache_cleaner_server.py
          python -m py_compile cache_cleaner_server.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v --tb=short
