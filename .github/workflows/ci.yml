name: Autonomous DevOps Bomb Squad CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  matrix-tests:
    name: Run Unit Tests & Qodo Quality Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      PYTHONPATH: "."

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Runtime & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pydantic mcp ruff

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ main.py cache_cleaner_server.py

      - name: Validate Bytecode Compilation
        run: |
          python -m py_compile src/mcp_servers/cache_cleaner_server.py cache_cleaner_server.py main.py

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Enforce Minimum Coverage Threshold
        run: |
          python -m pytest tests/ --cov=src --cov-fail-under=80 -q

  quality-gate:
    name: quality-gate
    needs: matrix-tests
    runs-on: ubuntu-latest
    steps:
      - name: Confirm All Checks Passed
        run: |
          echo "All unit tests, coverage, and Qodo quality checks passed across all Python matrix environments."
