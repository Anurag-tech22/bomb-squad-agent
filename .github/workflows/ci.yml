name: Autonomous DevOps Bomb Squad CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Qodo Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic

      - name: Validate Python Syntax
        run: |
          python -m py_compile src/mcp_servers/cache_cleaner_server.py
          python -m py_compile cache_cleaner_server.py

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short
